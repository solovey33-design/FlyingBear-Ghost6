#=========================ПОЧАТОК ДРУКУ==========================
[gcode_macro START_PRINT]
description:START_PRINT з підтримкою Адаптивної сітки та Автоматизації
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}

    ; --- ПРИМУСОВЕ ВИЗНАЧЕННЯ ОБ'ЄКТІВ ДЛЯ АДАПТИВУ ---
    EXCLUDE_OBJECT_DEFINE        ; Змушує Klipper прочитати межі моделі з g-коду

    ; --- КОНТРОЛЬ ФІЛАМЕНТУ (ЗАКОМЕНТОВАНО) ---
    ; M117 Контроль філаменту ввімкнено
    ; G92 E0
    ; SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=1
    ; SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1

    M140 S{BED_TEMP}             ; Почати нагрів столу
    G92 E0                       ; Скинути значення екструдера
    G90                          ; Абсолютні координати
    G28                          ; Перемістити всі осі в початкові точки (Home)
    
    M190 S{BED_TEMP}             ; Чекаємо повного нагріву столу
    M104 S{EXTRUDER_TEMP}        ; Почати нагрів екструдера
    
    ; --- АДАПТИВНА СІТКА СТОЛУ ---
    M117 Калібрування адаптивної сітки...
    BED_MESH_CALIBRATE
    
    M109 S{EXTRUDER_TEMP}        ; Дочекатися повного нагріву екструдера

    ; --- ОЧИЩЕННЯ ЗИГЗАГОМ ---
     CLEAN_ZIGZAG          

    ; --- СТАРТОВІ ЛІНІЇ ОЧИЩЕННЯ НА КРАЮ СТОЛУ ---
    G1 Z5.0 F3000                ; Підняття Z, щоб не подряпати стіл
    G1 X1 Y20 Z0.3 F5000.0       ; Перейти у безпечне стартове положення на столі (X=1)
    
    G1 X1 Y200.0 Z0.3 F1500.0 E15  ; Намалювати першу лінію вздовж осі Y
    G1 X2.5 Y200.0 Z0.3 F5000.0    ; Відійти трохи вбік по X
    G1 X2.5 Y20 Z0.3 F1500.0 E30   ; Намалювати другу лінію назад до Y=20
    
    G92 E0                       ; Скинути значення екструдера після видавлювання
    G1 Z2.0 F3000                ; Підняти Z
    G1 X10 Y20 Z0.3 F5000.0      ; Зсув убік, щоб відірвати краплю пластику перед початком друку
#-----------------------------------------------------------


#=====================ЗАВЕРШЕННЯ ДРУКУ======================
[gcode_macro END_PRINT]
description: Завершення друку для Flying Bear Ghost 6
gcode:
  G91 ; Відносне позиціонування
  G1 E-2 F2700 ; Ретракція філаменту (відкат 2мм)
  G1 E-2 Z0.2 F2400 ; Додатковий відкат і легке опускання столу на 0.2мм
  G1 X5 Y5 F3000 ; Зміщення вбік (Wipe out), щоб відірвати нитку пластику
  
  G1 Z5 F3000 ; Безпечно відсуваємо стіл ще на 5 мм вниз від деталі
  G90 ; Абсолютне позиціонування
  
  ; Презентація моделі та паркування голови
  G1 X1 Y210 F5000 ; Голову ховаємо в дальній лівий кут (X=1, Y=210)
  G1 Z150 F1000 ; Опускаємо стіл вниз на Z=150, щоб зручно зняти модель

  ; --- СИГНАЛ ЗАВЕРШЕННЯ ДРУКУ (Твій Зумер) ---
  BEEP

#   SET_PIN PIN=_Zummer VALUE=1
#   G4 P1000 ; Пищить 1 секунду
#   SET_PIN PIN=_Zummer VALUE=0
#   G4 P500  ; Пауза півсекунди
#   SET_PIN PIN=_Zummer VALUE=1
#   G4 P500  ; Пищить 0.5 секунди
#   SET_PIN PIN=_Zummer VALUE=0

  ; Вимкнення периферії
  M106 S0 ; Вимкнути вентилятор обдуву моделі
  M104 S0 ; Вимкнути хотенд
  M140 S0 ; Вимкнути стіл
  M84 ; Вимкнути крокові двигуни (шаговики)

  CAMERA_FAN_OFF               ; Вимкнути витяжку камери (миттєво)
 
  ; --- КОНТРОЛЬ ФІЛАМЕНТУ (ЗАКОМЕНТОВАНО) ---
  ; M117 Контроль філаменту вимкнено
  ; G92 E0
  ; SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=0
  ; SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
#----------------------------------------------------------------------


#================================ПАУЗА=================================
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
description: Пауза друку з безпечним відведенням сопла
gcode:
    # 1. Визначення безпечного підйому по осі Z (на 10 мм вгору від деталі)
    {% set z_max = printer.toolhead.axis_maximum.z|float %}
    {% set z_pos = printer.toolhead.position.z|float %}
    {% if z_pos < (z_max - 10.0) %}
        {% set z_safe = 10.0 %}
    {% else %}
        {% set z_safe = z_max - z_pos %}
    {% endif %}
    
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    
    # 2. Відкат пластику (ретракт 2мм), щоб не капав на модель
    G91
    G1 E-2 F2700                     
    
    # 3. Підйом сопла (опускання столу на безпечну відстань)
    G1 Z{z_safe} F900                
    
    # 4. Паркування голови у безпечну зону (передній лівий кут столу)
    G90
    G1 X10 Y10 F6000
#---------------------------------------------------------------------


#========================ВІДНОВЛЕННЯ ДРУКУ============================
[gcode_macro RESUME]
description: Нагрівання сопла та продовження друку
rename_existing: BASE_RESUME
gcode:
    ##### Перевірка та відновлення температури екструдера #####
    {% if printer.pause_resume.is_paused %}
        # Беремо температуру, яка була до паузи (або поточну цільову)
        {% set target_temp = printer.pause_resume.extrude_temp|default(0)|float %}
        
        {% if target_temp > 0 %}
            M117 Нагрівання сопла до {target_temp}C...
            M109 S{target_temp}   ; Чекаємо на повний прогрів сопла
        {% endif %}
        
        # --- БЕЗПЕЧНЕ ОЧИЩЕННЯ ОБ ЩІТКУ ПРИ ВІДНОВЛЕННІ ---
        # Викликаємо ТІЛЬКИ рухи змійки без жодних перевірок G28!
        _DO_ZIGZAG_CLEAN

        # 1. Повернення пластику після паузи (лише якщо сопло гаряче)
        {% if printer.extruder.can_extrude|lower == 'true' %}
            G91
            G1 E1 F1800             ; Повертаємо 1мм пластику (компенсація ретракту з PAUSE)
            G90
        {% endif %}

        M117 Відновлення друку...
        # 2. Повернення на деталь у точну точку зупинки
        RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=60 
        BASE_RESUME
    {% else %}
        {action_respond_info("Принтер не на паузі, команда RESUME ігнорується")}
    {% endif %}
#--------------------------------------------------------------------


#========================СКАСУВАННЯ ДРУКУ============================
[gcode_macro CANCEL_PRINT]
description: Скасування поточного друку з безпечним паркуванням для Flying Bear Ghost 6
rename_existing: CANCEL_PRINT_BASE
gcode:
    M117 Скасування друку...
    # 1. Вимикаємо нагрів та вентилятори
    TURN_OFF_HEATERS             ; Вимикає сопло та стіл
    M107                         ; Вимикає обдув деталі
    
    # 2. Безпечно відсуваємо стіл, якщо принтер не на паузі
    {% if not printer.pause_resume.is_paused %}
        G91                      ; Відносні координати
        G1 E-4 F2700             ; Безпечний відкат пластику
        
        # Перевірка висоти Z, щоб не вдарити дно або рамку
        {% set z_max = printer.toolhead.axis_maximum.z|float %}
        {% set z_pos = printer.toolhead.position.z|float %}
        {% if z_pos < (z_max - 15.0) %}
            G1 Z15 F900          ; Опускаємо стіл на 15 мм вниз від сопла
        {% else %}
            G1 Z{z_max - z_pos} F900
        {% endif %}
    {% endif %}
    
    # 3. Презентація моделі та безпечне паркування голови
    G90                          ; Абсолютні координати
    G1 X1 Y210 F5000 ; Голову ховаємо в дальній лівий кут (X=1, Y=210)
    G1 Z150 F1000 ; Опускаємо стіл вниз на Z=150, щоб зручно зняти модель
    BEEP
    # 4. Контроль датчиків філаменту (ЗАКОМЕНТОВАНО)
    ; M117 Контроль філаменту вимкнено
    ; G92 E0
    ; SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=0  
    ; SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0  
    
    # Очищення налаштувань шарів OrcaSlicer / Bambu Studio
    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
    
    # 5. Скидання стану в Klipper та офіційна зупинка друку
    CLEAR_PAUSE                  ; Очищає пам'ять паузи
    SDCARD_RESET_FILE            ; Скидає завантажений файл g-коду
    CANCEL_PRINT_BASE            ; Викликає базову команду скасування
    CAMERA_FAN_OFF               ; Вимкнути витяжку камери (миттєво)
 #   LIGHT_OFF_5MIN               ; Запустити 5-хвилинний таймер для світла
#-------------------------------------------------------------------------


#=====================ПОВНЕ КАЛІБРУВАННЯ СІТКИ СТОЛУ======================
[gcode_macro FULL_BED_MESH_CALIBRATE]
description: Повне калібрування сітки столу
gcode:
    # Очищаємо старі профілі з пам'яті
    BED_MESH_CLEAR
    
    # Обов'язкове паркування (якщо принтер ще не відпаркований)
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
    # Запускаємо вимірювання сітки столу
    BED_MESH_CALIBRATE
    
    # Зберігаємо карту під стандартним ім'ям default
    BED_MESH_PROFILE SAVE=default
    
    # Записуємо налаштування у printer.cfg та перезавантажуємо Klipper
    SAVE_CONFIG
#-------------------------------------------------------------------------


#==============ПЕРЕВІРКА ТА КАЛІБРУВАННЯ ГВИНТІВ СТОЛУ====================
[gcode_macro CHECK_SCREWS]
description: Перевірка та калібрування гвинтів столу
gcode:
    # Перевіряємо, чи зроблено Home для осей, якщо ні — паркуємо принтер
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
    # Запускаємо сам процес вимірювання гвинтів
    SCREWS_TILT_CALCULATE
#-------------------------------------------------------------------------


#========================ЗАВАНТАЖЕННЯ ПЛАСТИКУ============================
[gcode_macro LOAD_FILAMENT]
description: Автоматичне завантаження пластику
gcode:
    SAVE_GCODE_STATE NAME=load_state
		
    # Перевірка: якщо температура сопла нижче 200°C, гріємо його до 220°C
    {% if printer.extruder.temperature < 200 %}
        M117 Нагрів сопла до 220C...
        M109 S220
    {% endif %}
    
    M117 Завантаження філаменту!
    G91                  ; Відносні координати для екструдера
    G1 E40 F600          ; Швидка подача нового пластику в екструдер
    G1 E10 F200          ; Повільне продавлювання для очищення сопла від залишків
    G90                  ; Абсолютні координати назад
    M117 Філамент завантажено!
    RESTORE_GCODE_STATE NAME=load_state
#----------------------------------------------------------------------------


#=============================ВИВАНТАЖЕННЯ ПЛАСТИКУ===============================
[gcode_macro UNLOAD_FILAMENT]
description: Автоматичне вивантаження пластику
gcode:
    SAVE_GCODE_STATE NAME=unload_state
	
    # Перевірка: якщо температура сопла нижче 200°C, гріємо його до 220°C
    {% if printer.extruder.temperature < 200 %}
        M117 Нагрів сопла до 220C...
        M109 S220
    {% endif %}
    
    M117 Вивантаження філаменту!
    G91                  ; Відносні координати для екструдера
    G1 E1.5 F300         ; Продавлювання вперед, щоб розплавити кінчик
    G1 E-10 F3000        ; Швидкий різкий відкат, щоб не утворилося нитки
    G1 E-40 F1000        ; Повне вивантаження з екструдера
    G90                  ; Абсолютні координати назад
    M117 Філамент вивантажено!
    RESTORE_GCODE_STATE NAME=unload_state
#----------------------------------------------------------------------


#=============АВТОМАТИЧНЕ ВИВАНТАЖЕННЯ ПЛАСТИКА ПІД ЧАС ПАУЗИ============
[gcode_macro M600]
description: Заміна філаменту (Пауза + Вивантаження)
gcode:
    PAUSE                ; Викликає макрос паузи з безпечним паркуванням
    UNLOAD_FILAMENT      ; Автоматично виштовхує старий пластик
#------------------------------------------------------------------------


#=====================КАЛІБРУВАННЯ PID ЕКСТРУДЕРА======================
[gcode_macro PID_EXTRUDER]
description: Автоматичне калібрування PID сопла на 210C зі збереженням
gcode:
  M117 Нагрів та обдув увімкнено...
  M106 S255                      ; Обов'язково вмикаємо обдув моделі на 100%
  
  PID_CALIBRATE HEATER=extruder TARGET=240
  
  M106 S0                        ; Вимикаємо обдув моделі
  M117 Збереження конфігурації...
  G4 P1000                       ; Пауза 1 секунда для стабілізації
  SAVE_CONFIG                    ; Автоматичне збереження та перезапуск
#---------------------------------------------------------------------


#=======================КАЛІБРУВАННЯ PID СТОЛУ========================
[gcode_macro PID_BED]
description: Автоматичне калібрування PID столу на 60C зі збереженням
gcode:
  M117 Калібрування столу...
  
  PID_CALIBRATE HEATER=heater_bed TARGET=80
  
  M117 Збереження конфігурації...
  G4 P1000                       ; Пауза 1 секунда для стабілізації
  SAVE_CONFIG                    ; Автоматичне збереження та перезапуск
#----------------------------------------------------------------------


#==========ВВІМКНЕННЯ ТА ВИМКНЕННЯ ВЕНТИЛЯТОРА ВИТЯЖКИ З КАМЕРИ============
[gcode_macro CAMERA_FAN_ON]
description: Увімкнути вентилятор камери
gcode:
    {% set speed = params.S|default(0.4)|float %}
    SET_FAN_SPEED FAN=camera_Fan SPEED={speed}

[gcode_macro CAMERA_FAN_OFF]
description: Вимкнути вентилятор камери
gcode:
    SET_FAN_SPEED FAN=camera_Fan SPEED=0.0
#---------------------------------------------------------------------------


#=============================ЗВУКОВИЙ СИГНАЛ=============================
[gcode_macro BEEP]
description: Звуковий сигнал
gcode:
  SET_PIN PIN=beeper VALUE=1   # написати в END_Print beep 
  G4 P2500                    # тоді в кінці друку зумер бібікне 4 рази, це 5 секунд
  SET_PIN PIN=beeper VALUE=0  
#-------------------------------------------------------------------------


#=============================ОЧИЩЕННЯ СОПЛА==============================
# --- ВНУТРІШНЯ ФУНКЦІЯ: ТІЛЬКИ РУХИ ЗИГЗАГА (З ФІКСАЦІЄЮ ШВИДКОСТІ) ---
[gcode_macro _DO_ZIGZAG_CLEAN]
gcode:
    # Зберігаємо поточний стан швидкості друку, щоб не збити слайсер
    SAVE_GCODE_STATE NAME=zigzag_speed_state

    M220 S100                       ; ПРИМУСОВО: встановлюємо швидкість принтера на 100% (чистий Feedrate)
    G90                             ; Абсолютні координати
    G1 X-18 Y70 F6000               ; Підхід до початкової точки щітки

    # Цикл очищення (3 повторення = 6 проходів)
    {% for i in range(3) %}
        # Прохід ВПЕРЕД (Y від 70 до 120)
        G1 X-13 Y80 F4500.0
        G1 X-18 Y90 F4500.0
        G1 X-13 Y100 F4500.0
        G1 X-18 Y110 F4500.0
        G1 X-13 Y120 F4500.0            

        # Прохід НАЗАД (Y від 120 до 70)
        G1 X-18 Y110 F4500.0
        G1 X-13 Y100 F4500.0
        G1 X-18 Y90 F4500.0
        G1 X-13 Y80 F4500.0
        G1 X-18 Y70 F4500.0             
    {% endfor %}
    
    G1 X20 F6000                    ; Вихід із зони щітки праворуч на стіл

    # Відновлюємо той коефіцієнт швидкості, який був на моделі до чищення
    RESTORE_GCODE_STATE NAME=zigzag_speed_state


# --- ОСНОВНИЙ МАКРОС ДЛЯ СТАРТУ ТА ВРУЧНУ (З ПЕРЕВІРКАМИ) ---
[gcode_macro CLEAN_ZIGZAG]
description: Безпечне автоматичне очищення сопла перед друком або вручну
gcode:
    # Перевірка паркування (Тільки для безпечного старту або ручного виклику!)
    {% if "xyz" not in printer.toolhead.homed_axes %}
        M117 Паркування осей перед чищенням...
        G28
    {% endif %}

    # Перевірка температури
    {% if printer.extruder.temperature < 180 %}
        M117 Нагрів сопла для чищення...
        M109 S200
    {% endif %}

    M117 Очищення сопла...
    _DO_ZIGZAG_CLEAN                ; Викликаємо чисті рухи змійки
    M117 Сопло очищено!
#-----------------------------------------------------------------------


#======================ЗАХИСТ ПЕРЕД ПОДАЧЕЮ ПЛАСТИКУ========================
[gcode_macro LOW_TEMP_CHECK]
description: Захисна перевірка температури екструдера перед подачею пластику
gcode:
    {% set extruder_temp = params.T|default(200)|float %}
    {% if printer.extruder.target > extruder_temp %}                            # Якщо задана цільова температура вища, беремо її
        {% set extruder_temp = printer.extruder.target %}
    {% endif %}
    {% if printer.extruder.temperature < extruder_temp %}                       # Гріємо сопло, якщо поточна температура нижча за безпечну
        M118 Нагрівання сопла до {extruder_temp}C...
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={extruder_temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp}
    {% endif %}
#---------------------------------------------------------------------------


