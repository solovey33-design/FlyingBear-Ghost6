# ======================================================================
#  НАЛАШТУВАННЯ КЛІЄНТА ТА ПАУЗИ (БЕЗПЕЧНА СХОВИЩЕ ДАНИХ)
# ======================================================================
[gcode_macro _CLIENT_VARIABLE]
variable_idle_timeout   : 10800  ; Тримати стіл гарячим і мотори заблокованими 3 години
variable_use_custom_pos : True   ; Дозволити власну точку паркування голови
variable_custom_park_x  : 10.0   ; Безпечний лівий кут столу по X
variable_custom_park_y  : 10.0   ; Безпечний лівий кут столу по Y
variable_custom_park_dz : 5.0    ; Підняти сопло (опустити стіл) на 5 мм від моделі
variable_retract        : 2.0    ; Величина відкату пластику під час паузи (мм)
variable_unretract      : 2.0    ; Повернення пластику при відновленні друку (мм)
variable_speed_retract  : 35     ; Швидкість відкату (мм/с)
variable_speed_unretract: 30     ; Швидкість повернення пластику (мм/с)
variable_speed_hop      : 15     ; Швидкість руху по осі Z
variable_speed_move     : 100    ; Швидкість холостого ходу голови в кут (мм/с)
variable_use_fw_retract : False  ; Використовувати звичайний ретракт замість прошивочного
gcode:
    # Цей блок служить лише для збереження параметрів для макросів нижче

# ======================================================================
#  СИСТЕМНІ МАКРОСИ СЛАЙСЕРА (ПАУЗА НА ШАРАХ)
# ======================================================================
[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Увімкнути паузу при досягненні наступного шару (для OrcaSlicer)
gcode:
  {% set pause_next_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_next_layer %}
  {% set ENABLE = params.ENABLE | default(1) | int != 0 %}
  {% set MACRO = params.MACRO | default(pause_next_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_next_layer VALUE="{{ 'enable': ENABLE, 'call': MACRO }}"

[gcode_macro SET_PAUSE_AT_LAYER]
description: Увімкнути/вимкнути паузу при досягненні конкретного номера шару
gcode:
  {% set pause_at_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer %}
  {% set ENABLE = params.ENABLE | int != 0 if params.ENABLE is defined else params.LAYER is defined %}
  {% set LAYER = params.LAYER | default(pause_at_layer.layer) | int %}
  {% set MACRO = params.MACRO | default(pause_at_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_at_layer VALUE="{{ 'enable': ENABLE, 'layer': LAYER, 'call': MACRO }}"

[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: SET_PRINT_STATS_INFO_BASE
description: Перехоплення даних слайсера для реалізації функцій паузи по шарах
variable_pause_next_layer: { 'enable': False, 'call': "PAUSE" }
variable_pause_at_layer  : { 'enable': False, 'layer': 0, 'call': "PAUSE" }
gcode:
  {% if pause_next_layer.enable %}
    RESPOND TYPE=echo MSG='{"%s, примусово через pause_next_layer" % pause_next_layer.call}'
    {pause_next_layer.call}
    SET_PAUSE_NEXT_LAYER ENABLE=0
  {% elif pause_at_layer.enable and params.CURRENT_LAYER is defined and params.CURRENT_LAYER | int == pause_at_layer.layer %}
    RESPOND TYPE=echo MSG='{"%s, примусово через pause_at_layer [%d]" % (pause_at_layer.call, pause_at_layer.layer)}'
    {pause_at_layer.call}
    SET_PAUSE_AT_LAYER ENABLE=0
  {% endif %}
  SET_PRINT_STATS_INFO_BASE {rawparams}

# ======================================================================
#  ВНУТРІШНІ СИСТЕМНІ ФУНКЦІЇ ДЛЯ РУХУ ГОЛОВИ ТА ЕКСТРУДЕРА
# ======================================================================
[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Допоміжний макрос безпечного паркування під час паузи
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity | default(50) %}
  
  {% set park_dz        = client.custom_park_dz | default(2.0) | abs %}
  {% set sp_hop         = client.speed_hop | default(15) * 60 %}
  {% set sp_move        = client.speed_move | default(velocity) * 60 %}
  
  {% set act       = printer.gcode_move.gcode_position %}
  {% set max       = printer.toolhead.axis_maximum %}
  
  {% set z_park = [(act.z + park_dz), max.z] | min %}
  {% set x_park = client.custom_park_x | default(10.0) %}
  {% set y_park = client.custom_park_y | default(10.0) %}
  
  _CLIENT_RETRACT
  {% if "xyz" in printer.toolhead.homed_axes %}
    G90
    G1 Z{z_park} F{sp_hop}
    G1 X{x_park} Y{y_park} F{sp_move}
    {% if not printer.gcode_move.absolute_coordinates %} G91 {% endif %}
  {% else %}
    RESPOND TYPE=echo MSG='Принтер не відпаркований (not homed)'
  {% endif %}

[gcode_macro _CLIENT_EXTRUDE]
description: Системна команда видавлювання пластику
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
  {% set length = params.LENGTH | default(client.unretract) | default(1.0) | float %}
  {% set speed = params.SPEED | default(client.speed_unretract) | default(35) %}
  {% set absolute_extrude = printer.gcode_move.absolute_extrude %}
  
  {% if printer.toolhead.extruder != '' %}
    {% if printer[printer.toolhead.extruder].can_extrude %}
      M83
      G1 E{length} F{(speed | float | abs) * 60}
      {% if absolute_extrude %}
        M82
      {% endif %}
    {% else %}
      RESPOND TYPE=echo MSG='Екструзія скасована: сопло занадто холодне!'
    {% endif %}
  {% endif %}

[gcode_macro _CLIENT_RETRACT]
description: Системна команда відкату пластику
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
  {% set length = params.LENGTH | default(client.retract) | default(1.0) | float %}
  {% set speed = params.SPEED | default(client.speed_retract) | default(35) %}

  _CLIENT_EXTRUDE LENGTH=-{length | float | abs} SPEED={speed | float | abs}