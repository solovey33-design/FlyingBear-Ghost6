#============================ ПІДКЛЮЧЕННЯ ПЛАТИ ==============================
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_300025000D51323432353130-if00
restart_method: command

### Системні компоненти для зв'язку з інтерфейсом та макросами
[include macro.cfg] # Додати макроси
[pause_resume] 
[display_status] 
[respond] 
[exclude_object]                 # Додано для роботи адаптивної сітки столу та скасування окремих деталей!
[include KAMP_Settings.cfg]
[include klipper-backup.cfg]
#-----------------------------------------------------------------------------


#==================================== ЗУМЕР ==================================
# [output_pin beeper]
# pin: PA2

[output_pin beeper]
pin: !PE6          # Знак оклику інвертує логіку: коли Klipper подає сигнал, пін притискається до GND і зумер пищить
value: 0
shutdown_value: 0
#-----------------------------------------------------------------------------


#================================ INPUTSHAPING ================================
[input_shaper]
#shaper_type_x = ei
#shaper_freq_x = 55
#shaper_type_y = ei
#shaper_freq_y = 70
#-----------------------------------------------------------------------------


#====================== ВЕНТИЛЯТОР ВИТЯЖКИ З КАМЕРИ ==========================
[fan_generic camera_Fan]
pin: PB0
#cycle_time: 0.05
kick_start_time: 0.5
#-----------------------------------------------------------------------------


#========================== ДАТЧИК АВТОРІВНЯ СТОЛУ ===========================
[bltouch]
sensor_pin: ^PC8
control_pin: PA8
y_offset: 42
#z_offset: 2.0
x_offset: 0
speed: 7.0
samples: 2
samples_tolerance_retries: 4
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.1
#-----------------------------------------------------------------------------


#==================== МЕХАНІЗМ БЕЗПЕЧНОГО ПАРКУВАННЯ ОСІ Z ===================
[safe_z_home]
home_xy_position: 115,70
z_hop: 10
move_to_previous: False
z_hop_speed: 10
speed: 50
#-----------------------------------------------------------------------------


#====================== КАЛІБРУВАННЯ ПОВЕРХНІ СТОЛУ ==========================
[bed_mesh]
speed: 90
horizontal_move_z: 5
mesh_min: 10, 47
mesh_max: 215, 220
probe_count: 5, 5
algorithm: bicubic
zero_reference_position: 115, 70  # Центр безпечного паркування (допомагає математиці Klipper)
fade_start: 1                      # на якій висоті починати вирівнювати модель
fade_end: 10                       # на якій висоті закінчити вирівнювати модель
#-----------------------------------------------------------------------------

#======================= ВИРІВНЮВАННЯ СТОЛУ ГВИНТАМИ =========================
[screws_tilt_adjust]
# Передній лівий гвинт (базовий, відносно якого рівняємо інші)
screw4: 30, 1
screw4_name: Передній лівий
# Передній правий гвинт
screw1: 198, 1
screw1_name: Передній правий
# Задній правий гвинт
screw2: 198, 155
screw2_name: Задній правий
# Задній лівий гвинт
screw3: 30, 155
screw3_name: Задній лівий
speed: 100
screw_thread: CW-M4
#-----------------------------------------------------------------------------


#=========================== НАЛАШТУВАННЯ ДВИГУНІВ ===========================
#------------------------------------ X --------------------------------------
[stepper_x]
step_pin: PE3
dir_pin: !PE2
enable_pin: !PE4
microsteps: 32
rotation_distance: 39.7
endstop_pin: !PA15
# Коли голова натискає лівий кінцевик, вона перебуває на координаті -20 від краю столу
position_endstop: -20  
position_min: -20
# Максимальний хід сопла по ширині нового столу
position_max: 220  
homing_speed: 35
#------------------------------------ Y -------------------------------------
[stepper_y]
step_pin: PE0
dir_pin: !PB9
enable_pin: !PE1
microsteps: 32
rotation_distance: 39.7
endstop_pin: !PD2
position_endstop: 1
position_max: 220
homing_speed: 40
#------------------------------------ Z -------------------------------------
[stepper_z]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB8
microsteps: 32
rotation_distance: 7.94
endstop_pin: probe:z_virtual_endstop
position_min: -3
homing_speed: 10
second_homing_speed: 2
position_max: 200
#------------------------------ E (Extruder) -------------------------------
[extruder]
step_pin: PD6
dir_pin: PD3
enable_pin: !PB3
microsteps: 16
rotation_distance: 7.814
max_extrude_only_distance: 1400.0
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PE5
sensor_type: ATC Semitec 104GT-2
#sensor_type: Generic 3950 # якщо сенсор замінено на 3950 потрібно закоментувати попередню строчку, а розкоментувати цю
sensor_pin: PC1
#control: pid
#pid_Kp: 14.669
#pid_Ki: 0.572
#pid_Kd: 94.068
min_temp: 0
max_temp: 320
#---------------------------------------------------------------------------


#============================== НАГРІВАННЯ СТОЛУ ===========================
[heater_bed]
heater_pin: PA0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
#control: pid
#pid_Kp: 71.783
#pid_Ki: 1.977
#pid_Kd: 651.428
min_temp: 0
max_temp: 130
#---------------------------------------------------------------------------


#=========================== КУЛЕР ОБДУВУ МОДЕЛІ ===========================
[fan]
pin: PB1
#off_below: 0.25
#shutdown_speed: 0.0
#---------------------------------------------------------------------------


#=========================== КУЛЕР ОБДУВУ ХОТЕНДУ ==========================
[heater_fan nozzle_fan]
pin: PC14
#kik_start_time: 0.1
shutdown_speed: 1.0
heater: extruder
heater_temp: 50
fan_speed: 1.0
#---------------------------------------------------------------------------


#========= ВИМКНЕННЯ ПО ПРОСТОЮ. Якщо потрібно - розкоментувати ============
#[idle_timeout]
#timeout: 1200
#gcode:
#  M84
#  SHUTDOWN_MACHINE
#---------------------------------------------------------------------------


#=== Датчики різніх температур. Можна змінити назву, головне замість пробілів ставити нижнє підкреслювання
[temperature_sensor orange_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100
#--------------------------------------------------------------------------


#== Якщо червона плата  Robin Nano4 3.2 то закоментувати наступной розділ =
# [temperature_sensor mcu_temp]
# sensor_type: temperature_mcu
# min_temp: 0
# max_temp: 100
#--------------------------------------------------------------------------


#======================= РЕГУЛЮВАННЯ РЕТРАКТІВ ============================
[firmware_retraction]
retract_length: 0.6
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 35
#--------------------------------------------------------------------------


#========================== ПАРАМЕТРИ ПРИНТЕРА ============================
# [printer]
# kinematics: corexy
# max_velocity: 400
# square_corner_velocity: 5.0
# max_accel: 8000
# #max_accel_to_decel: 4000
# max_z_velocity: 25
# max_z_accel: 100

[printer]
kinematics: corexy
max_velocity: 200        # Знижуємо з 400 до 200 мм/с (холості переміщення стануть плавними)
square_corner_velocity: 5.0
max_accel: 2500          # Знижуємо з 8000 до 2500 мм/с² (це прибере різкі удари й дикий гул)
max_z_velocity: 15       # Для осі Z краще поставити 15, щоб гвинт не свистів
max_z_accel: 100

#--------------------------------------------------------------------------


#====================== МІСЦЕЗНАХОДЖЕННЯ ФАЙЛІВ КОДУ ======================
[virtual_sdcard]
path: ~/printer_data/gcodes
#--------------------------------------------------------------------------

# [controller_fan board_fan]
# pin: PA2                                            # Керуємо силовим роз'ємом FAN4
# max_power: 1.0
# kick_start_time: 0.500
# stepper: stepper_x, stepper_y, stepper_z, extruder # Увімкнеться на повну, як тільки запрацює будь-який двигун
# heater: heater_bed, extruder                       # Або якщо почнеться нагрівання столу чи хотенду
# idle_timeout: 60                                    # Працюватиме ще 60 секунд після зупинки друку, щоб остудити драйвери
# idle_speed: 0.0                                     # Швидкість у простої (0.0 — повна тиша, вентилятор вимкнено)


[temperature_fan board_fan]
pin: PA2
gcode_id: C                     # <-- ДОДАЙТЕ ЦЕЙ РЯДОК (дозволяє керування через G-код та інтерфейс)
sensor_type: temperature_mcu
sensor_mcu: mcu
control: pid
pid_Kp: 1.0
pid_Ki: 0.5
pid_Kd: 2.0
min_temp: 0
max_temp: 90
target_temp: 35.0               # Стартова ціль при увімкненні принтера
min_speed: 0.0
max_speed: 1.0
off_below: 0.20

# ==========================================
# 1. ПЕРЕХОПЛЕННЯ РУЧНОГО КЕРУВАННЯ З FLUIDD
# ==========================================
[gcode_macro SET_HEATER_TEMPERATURE]
rename_existing: SET_HEATER_TEMPERATURE_BASE
gcode:
    {% set target = params.TARGET|default(0)|int %}
    {% if target > 0 %}
        SET_TEMPERATURE_FAN_TARGET temperature_fan=board_fan target=20
    {% else %}
        SET_TEMPERATURE_FAN_TARGET temperature_fan=board_fan target=35
    {% endif %}
    SET_HEATER_TEMPERATURE_BASE {rawparams}

# ==========================================
# 2. ПЕРЕХОПЛЕННЯ КОМАНД СЛАЙСЕРА (ДЛЯ ДРУКУ)
# ==========================================
[gcode_macro M104]
rename_existing: M104.1
gcode:
    {% set S = params.S|default(0)|int %}
    {% if S > 0 %}
        SET_TEMPERATURE_FAN_TARGET temperature_fan=board_fan target=20
    {% else %}
        SET_TEMPERATURE_FAN_TARGET temperature_fan=board_fan target=35
    {% endif %}
    M104.1 {rawparams}

[gcode_macro M109]
rename_existing: M109.1
gcode:
    {% set S = params.S|default(0)|int %}
    {% if S > 0 %}
        SET_TEMPERATURE_FAN_TARGET temperature_fan=board_fan target=20
    {% else %}
        SET_TEMPERATURE_FAN_TARGET temperature_fan=board_fan target=35
    {% endif %}
    M109.1 {rawparams}

[gcode_macro M140]
rename_existing: M140.1
gcode:
    {% set S = params.S|default(0)|int %}
    {% if S > 0 %}
        SET_TEMPERATURE_FAN_TARGET temperature_fan=board_fan target=20
    {% else %}
        SET_TEMPERATURE_FAN_TARGET temperature_fan=board_fan target=35
    {% endif %}
    M140.1 {rawparams}

[gcode_macro M190]
rename_existing: M190.1
gcode:
    {% set S = params.S|default(0)|int %}
    {% if S > 0 %}
        SET_TEMPERATURE_FAN_TARGET temperature_fan=board_fan target=20
    {% else %}
        SET_TEMPERATURE_FAN_TARGET temperature_fan=board_fan target=35
    {% endif %}
    M190.1 {rawparams}

# ==========================================
# 3. АВТОМАТИЧНЕ ВИМКНЕННЯ ПІСЛЯ ДРУКУ
# ==========================================
[gcode_macro TURN_OFF_HEATERS]
rename_existing: TURN_OFF_HEATERS_BASE
gcode:
    TURN_OFF_HEATERS_BASE
    SET_TEMPERATURE_FAN_TARGET temperature_fan=board_fan target=35



