z_hop: 10
move_to_previous: False                                                       # Return back ~X0/Y0 after Z0 at center
z_hop_speed: 10
speed: 50


[gcode_macro G29]
description: Повне калібрування сітки столу
gcode:
    # Очищаємо старі профілі з пам'яті
    BED_MESH_CLEAR
    
    # Обов'язкове паркування (якщо принтер ще не відпаркований)
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    
    # Запускаємо вимірювання сітки столу
    BED_MESH_CALIBRATE
    
    # Зберігаємо карту під стандартним ім'ям default
    BED_MESH_PROFILE SAVE=default
    
    # Записуємо налаштування у printer.cfg та перезавантажуємо Klipper
    SAVE_CONFIG



[bed_mesh]
speed: 40
horizontal_move_z: 5 # отступ во время проб по оси Z

# Координати першої точки вимірювання (для ДАТЧИКА)
mesh_min: 10, 47
# Координати останньої точки вимірювання (для ДАТЧИКА)
mesh_max: 220, 220
probe_count: 5, 5
algorithm: bicubic
fade_start: 1 #на какой высоте начнем выравнивать модель
fade_end: 10 #на этой высоте в мм закончим выравнивать.

[screws_tilt_adjust]
# Передній лівий гвинт (базовий, відносно якого рівняємо інші)
screw4: 30, 1
screw4_name: Передній лівий
# Передній правий гвинт
screw1: 198, 1
screw1_name: Передній правий
# Задній правий гвинт
screw2: 198, 155
screw2_name: Задній правий
# Задній лівий гвинт
screw3: 30, 155
screw3_name: Задній лівий

speed: 100
screw_thread: CW-M4



[stepper_x]
step_pin: PE3
dir_pin: !PE2
enable_pin: !PE4
microsteps: 32
rotation_distance: 40
endstop_pin: !PA15

# Коли голова натискає лівий кінцевик, вона перебуває на координаті -20 від краю столу
position_endstop: -20  
position_min: -20
# Максимальний хід сопла по ширині нового столу
position_max: 220  

# position_endstop: -20
# position_max: 255
homing_speed: 35

[stepper_y]
step_pin: PE0
dir_pin: !PB9
enable_pin: !PE1
microsteps: 32
rotation_distance: 40
endstop_pin: !PD2
position_endstop: 1
position_max: 220
homing_speed: 40

[stepper_z]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB8
microsteps: 32
rotation_distance: 8
#endstop_pin: !PC8
endstop_pin: probe:z_virtual_endstop
#position_endstop: 0.5
position_min: -3
homing_speed: 10
second_homing_speed: 2
#position_min: -20
position_max: 200

[extruder]
step_pin: PD6
dir_pin: PD3
enable_pin: !PB3
microsteps: 16
rotation_distance: 7.815
max_extrude_only_distance: 1400.0
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PE5
sensor_type: ATC Semitec 104GT-2
#sensor_type: Generic 3950 # если меняли на 3950 закомментируй строчку выше, раскомментриуй эту
sensor_pin: PC1
control: pid
pid_Kp: 14.669
pid_Ki: 0.572
pid_Kd: 94.068
min_temp: 0
max_temp: 320

[heater_bed]
heater_pin: PA0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
control: pid
pid_Kp: 71.783
pid_Ki: 1.977
pid_Kd: 651.428
min_temp: 0
max_temp: 130
