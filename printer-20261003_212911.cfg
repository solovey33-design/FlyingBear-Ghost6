[bltouch]

sensor_pin: ^PC8
control_pin: PA8
y_offset: 42
z_offset: 2.0
x_offset: 0
speed: 7.0
samples: 2
samples_tolerance_retries: 4
samples_result: median
sample_retract_dist: 3.0
